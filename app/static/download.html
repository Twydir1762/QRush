<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Скачивание файла</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        details {
            overflow: hidden;
        }

        details[open] summary ~ * {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="sky" id="sky"></div>
    <div class="container">
        <header>
            <h1>QRush</h1>
            <img src="/static/cloud-icon.png" alt="Cloud Icon" class="cloud-icon">
        </header>
        <div class="message-area" id="fileInfo" style="margin-top: 30px; background-color: rgba(255, 255, 255, 0.418);">
            <h2 id="fileName" style="margin-bottom: 20px; font-size: 24px;">📥 Скачивание файла</h2>
            <div style="background: rgba(255, 255, 255, 0.6); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                <p id="fileSize" style="margin: 10px 0; font-size: 18px; font-weight: 500;"></p>
                <p id="uploadTime" style="margin: 10px 0; font-size: 18px; color: rgba(0, 0, 0, 0.8);"></p>
                <p id="expirationTime" style="margin: 10px 0; font-size: 18px; color: rgba(0, 0, 0, 0.8);"></p>
                <details id="contentDetails" style="margin-top: 20px; display: none;">
                    <summary style="cursor: pointer; font-weight: 500; padding: 10px 0; border-top: 1px solid rgba(0, 0, 0, 0.1);">📦 Содержимое архива</summary>
                    <div id="contentList" style="margin-top: 10px; padding-left: 10px; text-align: left; max-height: 250px; overflow-y: auto; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 4px; padding: 10px; margin: 10px 0;"></div>
                </details>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button id="downloadBtn" class="upload-button" style="display: block; width: 100%; margin: 0;">
                    <span class="button-text">Скачать файл</span>
                    <span class="spinner" style="display: none;"></span>
                </button>
                <a href="/" class="upload-button" style="text-decoration: none; display: block; width: 100%; margin: 0; text-align: center;">
                    На главную
                </a>
            </div>
        </div>
    </div>
    <script src="/static/cloud-script.js"></script>
    <script src="/static/download.js"></script>
</body>
</html>
